<!DOCTYPE html><html><head>  <meta charset="UTF-8">  <meta    name="viewport"    content="width=device-width, initial-scale=1.0"  >  <title>Mode</title>  <link    rel="stylesheet"    href="style.css"  >  <style>    .paris-top {      position: fixed;      top: 15px;      right: 15px;      z-index: 1000;    }    .paris-top button {      padding: 10px 18px;      border: none;      border-radius: 8px;      background: #00a86b;      color: white;      font-size: 16px;      font-weight: bold;      cursor: pointer;    }    .paris-top button:hover {      background: #008f5a;    }  </style></head><body>  <!-- ========================================= -->  <!-- BOUTON PARIS EN HAUT                     -->  <!-- ========================================= -->  <div class="paris-top">    <button onclick="ouvrirParis()">      💰 Paris    </button>  </div>  <!-- ========================================= -->  <!-- MODES DU JEU                             -->  <!-- ========================================= -->  <div class="container">    <h2 class="form-title">      Choisis ton mode    </h2>    <div class="card-dark">      <div class="btn-group">        <button onclick="location.href='jeu.html?vs=ai'">          Jouer avec l'IA        </button>        <button onclick="location.href='tournoi.html'">          Tournoi        </button>        <button onclick="location.href='programme.html'">          Programme        </button>      </div>    </div>  </div>  <!-- ========================================= -->  <!-- CONNEXION VERS LE SITE PARIS             -->  <!-- ========================================= -->  <script>    async function ouvrirParis() {      const token =        localStorage.getItem(          'gameonline_token'        );      if (!token) {        alert(          "Tu dois d'abord te connecter."        );        window.location.href =          "login.html";        return;      }      try {        /*         * Récupérer le joueur connecté         * depuis l'ancien serveur         */        const response =          await fetch(            '/api/player/me',            {              method: 'POST',              headers: {                'Content-Type':                  'application/json'              },              body: JSON.stringify({                token: token              })            }          );        const data =          await response.json();        if (!data.success) {          alert(            "Impossible de récupérer ton compte."          );          return;        }        const player =          data.player;        /*         * Préparer les informations         * du joueur pour PARIS         */        const params =          new URLSearchParams();        params.set(          'playerId',          player.id        );        params.set(          'firstname',          player.firstname        );        params.set(          'name',          player.name        );        params.set(          'phone',          player.phone        );        /*         * Ouvrir le nouveau site PARIS         * Port 3000         */        window.location.href =          'http://localhost:3000/?' +          params.toString();      }      catch (error) {        console.error(error);        alert(          "Impossible de contacter le serveur."        );      }    }  </script></body></html>
