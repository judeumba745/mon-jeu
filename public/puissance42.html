<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>PARIS - Puissance 4</title><style>*{box-sizing:border-box}body{ margin:0; min-height:100vh; background:#07100b; color:white; font-family:Arial; display:flex; justify-content:center; align-items:center;}.container{ width:95%; max-width:600px; text-align:center;}h1{color:#20ff78}.info{ background:#101722; padding:14px; border-radius:12px; margin-bottom:20px;}#plateau{ width:min(95vw,560px); background:#1556a8; padding:10px; border-radius:20px; display:grid; grid-template-columns:repeat(7,1fr); gap:8px; margin:auto;}.case{ aspect-ratio:1; background:#07100b; border-radius:50%; border:2px solid #263242;}.case.rouge{ background:#ff3333;}.case.jaune{ background:#ffd21f;}#status{ margin:20px; color:#20ff78;}#gameOver{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.88); justify-content:center; align-items:center; flex-direction:column;}#resultat{ color:#20ff78; font-size:30px;}button{ padding:12px 25px; border:0; border-radius:10px; background:#20ff78; font-weight:bold;}</style><script>(function () { const navigation = performance.getEntriesByType('navigation')[0]; // Actualisation
if (navigation && navigation.type === 'reload') { window.location.replace('/Paris.html'); return; } // Navigation directe vers la page
if (!document.referrer || !document.referrer.includes('Paris.html')) { window.location.replace('/Paris.html'); }})();</script> </head><body><div class="container"><h1>🔴🟡 PARIS — PUISSANCE 4</h1><div class="info"> <div id="joueur"></div> <div id="mise"></div> <div id="solde"></div></div><div id="plateau"></div><div id="status">La partie commence...</div></div><div id="gameOver"> <h2 id="resultat"></h2> <button onclick="location.href='index.html'">Retour</button></div><script>(async function(){ const params=new URLSearchParams(location.search);const choix=params.get("choix") || "rouge";const mise=Math.floor(Number(params.get("mise") || 0));const token=localStorage.getItem("gameonline_token"); let betId=null; if(!token || mise<=0){ alert("Session invalide ou mise incorrecte."); window.location.href="/Paris.html"; return; } try{ const miseRes=await fetch("/api/paris/mise",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,jeu:"puissance4",mise})}); const miseData=await miseRes.json(); if(!miseData.success){ alert("❌ "+(miseData.error||"Mise refusée.")); window.location.href="/Paris.html"; return; } betId=miseData.betId; document.getElementById("solde").textContent="Solde : "+miseData.wallet.points.toLocaleString("fr-FR")+" pts"; }catch(erreurMise){ alert("❌ Erreur de connexion au serveur."); window.location.href="/Paris.html"; return; } document.getElementById("joueur").textContent= "Couleur choisie : "+choix;document.getElementById("mise").textContent= "Mise : "+mise+" pts";const rows=6;const cols=7;let board= Array(rows).fill(null) .map(()=>Array(cols).fill(null));let tour="rouge";let termine=false;const plateau=document.getElementById("plateau");const status=document.getElementById("status");function afficher(){ plateau.innerHTML=""; for(let r=0;r<rows;r++){ for(let c=0;c<cols;c++){ const cell=document.createElement("div"); cell.className="case"; if(board[r][c]){ cell.classList.add(board[r][c]); } plateau.appendChild(cell); } }}function ligneLibre(col){ for(let r=rows-1;r>=0;r--){ if(!board[r][col]){ return r; } } return -1;}function gagner(r,c,couleur){ const directions=[ [0,1], [1,0], [1,1], [1,-1] ]; for(const [dr,dc] of directions){ let total=1; for(let i=1;i<4;i++){ const rr=r+dr*i; const cc=c+dc*i; if( rr>=0 && rr<rows && cc>=0 && cc<cols && board[rr][cc]===couleur ){ total++; }else break; } for(let i=1;i<4;i++){ const rr=r-dr*i; const cc=c-dc*i; if( rr>=0 && rr<rows && cc>=0 && cc<cols && board[rr][cc]===couleur ){ total++; }else break; } if(total>=4)return true; } return false;}function jouer(){ if(termine)return; const colonnes=[]; for(let c=0;c<cols;c++){ if(ligneLibre(c)!==-1){ colonnes.push(c); } } if(colonnes.length===0){ terminer("nul","🤝 Match nul !"); return; } let col; // Chercher une victoire
for(const c of colonnes){ const r=ligneLibre(c); board[r][c]=tour; if(gagner(r,c,tour)){ board[r][c]=null; col=c; break; } board[r][c]=null; } // Sinon choix aléatoire
if(col===undefined){ col= colonnes[ Math.floor(Math.random()*colonnes.length) ]; } const r=ligneLibre(col); board[r][col]=tour; afficher(); if(gagner(r,col,tour)){ terminer( tour===choix?"gagne":"perdu", tour===choix ? "🏆 Vous avez gagné !" : "💀 Votre adversaire gagne !" ); return; } tour=tour==="rouge"?"jaune":"rouge"; status.textContent= "Tour automatique : "+ (tour==="rouge"?"🔴 Rouge":"🟡 Jaune"); setTimeout(jouer,800);}async function terminer(etat, message){ termine=true; try{ const gagne=(etat!=="perdu"); const mult=(etat==="nul")?1:2; const resReq=await fetch("/api/paris/resoudre",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,betId,gagne,multiplicateur:mult})}); const resData=await resReq.json(); if(resData.success){ document.getElementById("solde").textContent="Solde : "+resData.wallet.points.toLocaleString("fr-FR")+" pts"; if(etat==="gagne"){ message+=" Gain : "+resData.gain+" pts."; afficherPopupGain(resData.gain); } else if(etat==="nul"){ message+=" Mise remboursée."; } } }catch(erreurResolution){ console.error(erreurResolution); } document.getElementById("resultat").textContent=message; document.getElementById("gameOver").style.display="flex"; status.textContent="Partie terminée";}
function afficherPopupGain(gain){ const popup=document.createElement("div"); popup.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:9999;"; popup.innerHTML=`<div style="background:#111b2b;border:1px solid #25344c;border-radius:15px;padding:30px;text-align:center;max-width:320px;font-family:inherit;color:#fff;"><div style="font-size:42px;">🎉</div><h3 style="margin:12px 0;">Vous avez gagné ${gain.toLocaleString("fr-FR")} points !</h3><p style="color:#8996aa;font-size:13px;">Ajoutés automatiquement à votre solde.</p><button id="fermerPopupGain" style="margin-top:15px;padding:10px 25px;border:none;border-radius:8px;background:#20ff78;color:#000;font-weight:bold;cursor:pointer;">OK</button></div>`; document.body.appendChild(popup); document.getElementById("fermerPopupGain").addEventListener("click",()=>popup.remove()); }afficher();setTimeout(jouer,1000);})();</script></body></html>
