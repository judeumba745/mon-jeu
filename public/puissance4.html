<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Puissance 4</title>
<style>
body { background: #0a0a0a; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 20px; }
#mode-badge { padding: 10px 20px; border-radius: 8px; font-weight: bold; margin-bottom: 15px; background: #92400e; color: #facc15; }
#status { font-size: 20px; margin: 15px 0; }
#plateau { background: #d4af37; padding: 10px; border-radius: 10px; display: grid; grid-template-columns: repeat(7, 60px); gap: 5px; }
.case { width: 60px; height: 60px; background: #111; border-radius: 50%; cursor: pointer; }
.case.rouge { background: radial-gradient(circle, #ef4444, #991b1b); }
.case.jaune { background: radial-gradient(circle, #facc15, #a16207); }
#gameOver { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; font-size: 40px; font-weight: bold; z-index: 100; }
</style>
</head>
<body>
<div id="mode-badge">Mode : Puissance 4</div>
<div id="status">Tour des Rouges</div>
<div id="plateau"></div>
<div id="gameOver"></div>
<script src="puissance.js"></script>
</body>
</html>
