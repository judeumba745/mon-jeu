<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Puissance 4</title>
<style>
body { background: #0a0a0a; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
#mode-badge { padding: 10px 20px; border-radius: 8px; font-weight: bold; margin-bottom: 15px; background: #92400e; color: #facc15; }
#status { font-size: 20px; margin: 15px 0; }
#plateau {
    display: grid;
    grid-template-columns: repeat(7, 60px);
    grid-template-rows: repeat(6, 60px);
    background: #d4af37;
    padding: 10px;
    border-radius: 10px;
    gap: 5px;
    margin: 20px auto;
}
.case {
    width: 60px;
    height: 60px;
    background: #111;
    border-radius: 50%;
    cursor: pointer;
    border: 3px solid #d4af37;
}
.case.rouge { background: radial-gradient(circle, #ef4444, #991b1b); }
.case.jaune { background: radial-gradient(circle, #facc15, #a16207); }
#gameOver {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.9); display: none; align-items: center;
    justify-content: center; font-size: 40px; font-weight: bold; z-index: 100;
    flex-direction: column;
}
button { padding: 15px 30px; font-size: 20px; margin-top: 20px; cursor: pointer; }
</style>
<script>(function () {  const navigation = performance.getEntriesByType('navigation')[0];  // Actualisation  if (navigation && navigation.type === 'reload') {    window.location.replace('/Paris.html');    return;  }  // Navigation directe vers la page  if (!document.referrer || !document.referrer.includes('Paris.html')) {    window.location.replace('/Paris.html');  }})();</script>
</head>
<body>
<div id="mode-badge">Mode : Puissance 4</div>
<div id="status">Tour des Rouges</div>
<div id="plateau"></div>
<div id="gameOver"></div>

<script>
const cols = 7, rows = 6;
const plateau = document.getElementById("plateau");
let board = Array.from({length: rows}, () => Array(cols).fill(null));
let tour = "rouge";
let gameOver = false;

// Créer les 42 cases - maintenant plateau existe car script est APRES le div
for(let r = 0; r < rows; r++) {
    for(let c = 0; c < cols; c++) {
        const cell = document.createElement("div");
        cell.classList.add("case");
        cell.dataset.row = r;
        cell.dataset.col = c;
        cell.onclick = () => drop(c);
        plateau.appendChild(cell);
    }
}

function drop(col) {
    if(gameOver || tour!== "rouge") return;
    for(let r = rows - 1; r >= 0; r--) {
        if(!board[r][col]) {
            board[r][col] = "rouge";
            document.querySelector(`.case[data-row="${r}"][data-col="${col}"]`).classList.add("rouge");
            if(checkWin(r, col, "rouge")) return endGame("Tu as gagné!");
            tour = "jaune";
            document.getElementById("status").innerText = "IA réfléchit...";
            setTimeout(aiPlay, 600);
            return;
        }
    }
}

function aiPlay() {
    let bestCol = -1;
    for(let c = 0; c < cols; c++) {
        let r = getFreeRow(c);
        if(r!== -1) {
            board[r][c] = "jaune";
            if(checkWin(r, c, "jaune")) { bestCol = c; board[r][c] = null; break; }
            board[r][c] = null;
        }
    }
    if(bestCol === -1) {
        for(let c = 0; c < cols; c++) {
            let r = getFreeRow(c);
            if(r!== -1) {
                board[r][c] = "rouge";
                if(checkWin(r, c, "rouge")) { bestCol = c; board[r][c] = null; break; }
                board[r][c] = null;
            }
        }
    }
    if(bestCol === -1) {
        const prefs = [3,2,4,1,5,0,6];
        for(let c of prefs) if(getFreeRow(c)!== -1) { bestCol = c; break; }
    }
    let r = getFreeRow(bestCol);
    board[r][bestCol] = "jaune";
    document.querySelector(`.case[data-row="${r}"][data-col="${bestCol}"]`).classList.add("jaune");
    if(checkWin(r, bestCol, "jaune")) return endGame("IA a gagné!");
    tour = "rouge";
    document.getElementById("status").innerText = "Ton tour";
}

function getFreeRow(col) {
    for(let r = rows - 1; r >= 0; r--) if(!board[r][col]) return r;
    return -1;
}

function checkWin(r, c, player) {
    const dirs = [[0,1],[1,0],[1,1],[1,-1]];
    for(let [dr, dc] of dirs) {
        let count = 1;
        for(let i = 1; i < 4; i++) if(board[r+dr*i]?.[c+dc*i] === player) count++; else break;
        for(let i = 1; i < 4; i++) if(board[r-dr*i]?.[c-dc*i] === player) count++; else break;
        if(count >= 4) return true;
    }
    return false;
}

function endGame(msg) {
    gameOver = true;
    document.getElementById("gameOver").innerHTML = `🎉 ${msg}<br><button onclick="location.reload()">Rejouer</button>`;
    document.getElementById("gameOver").style.display = "flex";
    document.getElementById("status").innerText = "Partie terminée";
}
</script>
</body>
</html>
