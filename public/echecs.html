<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Échecs</title>
<style>
body { background: #0a0a0a; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 20px; }
#mode-badge { padding: 10px 20px; border-radius: 8px; font-weight: bold; margin-bottom: 15px; background: #1e3a8a; }
#status { font-size: 20px; margin: 15px 0; }
#plateau { display: grid; grid-template-columns: repeat(8, 60px); background: #d4af37; padding: 5px; border-radius: 10px; }
.case { width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; font-size: 40px; cursor: pointer; }
.case.noir { background: #111; }
.case.blanc { background: #f5f5f5; color: #000; }
.case.selected { outline: 3px solid #facc15; }
#gameOver { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; font-size: 40px; font-weight: bold; z-index: 100; }
</style>
</head>
<body>
<div id="mode-badge">Mode : Échecs</div>
<div id="status">Tour des Blancs</div>
<div id="plateau"></div>
<div id="gameOver"></div>
<script src="echecs.js"></script>
</body>
</html>
