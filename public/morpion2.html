<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>PARIS - Morpion</title><style>*{box-sizing:border-box}body{ margin:0; min-height:100vh; background:#07100b; color:white; font-family:Arial; display:flex; justify-content:center; align-items:center;}.container{ width:95%; max-width:500px; text-align:center;}h1{color:#20ff78}.info{ background:#101722; padding:14px; border-radius:12px; margin-bottom:20px;}#plateau{ width:min(90vw,420px); height:min(90vw,420px); margin:auto; display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}.case{ background:#182231; border:2px solid #20ff78; border-radius:15px; display:flex; justify-content:center; align-items:center; font-size:70px; font-weight:bold;}.x{color:#ff4444}.o{color:#3b82f6}#status{ margin:20px; color:#20ff78;}#gameOver{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.88); justify-content:center; align-items:center; flex-direction:column;}#resultat{ color:#20ff78; font-size:30px;}button{ padding:12px 25px; border:0; border-radius:10px; background:#20ff78; font-weight:bold;}</style><script>(function () { const navigation = performance.getEntriesByType('navigation')[0]; // Actualisation
if (navigation && navigation.type === 'reload') { window.location.replace('/Paris.html'); return; } // Navigation directe vers la page
if (!document.referrer || !document.referrer.includes('Paris.html')) { window.location.replace('/Paris.html'); }})();</script> </head><body><div class="container"><h1>❌⭕ PARIS — MORPION</h1><div class="info"> <div id="joueur"></div> <div id="mise"></div> <div id="solde"></div></div><div id="plateau"></div><div id="status">La partie commence...</div></div><div id="gameOver"> <h2 id="resultat"></h2> <button onclick="location.href='index.html'">Retour</button></div><script>(async function(){ const params=new URLSearchParams(location.search);const choix=params.get("choix") || "X";const mise=Math.floor(Number(params.get("mise") || 0));const token=localStorage.getItem("gameonline_token"); let betId=null; if(!token || mise<=0){ alert("Session invalide ou mise incorrecte."); window.location.href="/Paris.html"; return; } try{ const miseRes=await fetch("/api/paris/mise",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,jeu:"morpion",mise})}); const miseData=await miseRes.json(); if(!miseData.success){ alert("❌ "+(miseData.error||"Mise refusée.")); window.location.href="/Paris.html"; return; } betId=miseData.betId; document.getElementById("solde").textContent="Solde : "+miseData.wallet.points.toLocaleString("fr-FR")+" pts"; }catch(erreurMise){ alert("❌ Erreur de connexion au serveur."); window.location.href="/Paris.html"; return; } document.getElementById("joueur").textContent= "Joueur choisi : "+choix;document.getElementById("mise").textContent= "Mise : "+mise+" pts";const plateau=document.getElementById("plateau");const status=document.getElementById("status");let board=Array(9).fill(null);let tour="X";let termine=false;function afficher(){ plateau.innerHTML=""; board.forEach((value,i)=>{ const cell=document.createElement("div"); cell.className="case"; if(value){ cell.textContent=value; cell.classList.add(value==="X"?"x":"o"); } plateau.appendChild(cell); });}function coupsPossibles(){ return board .map((v,i)=>v===null?i:null) .filter(v=>v!==null);}function gagner(p){ const lignes=[ [0,1,2], [3,4,5], [6,7,8], [0,3,6], [1,4,7], [2,5,8], [0,4,8], [2,4,6] ]; return lignes.some(l=> l.every(i=>board[i]===p) );}function jouerAutomatiquement(){ if(termine)return; const coups=coupsPossibles(); if(coups.length===0){ terminer("nul","🤝 Match nul !"); return; } let choixIA; const gagnantPossible=coups.find(i=>{ board[i]=tour; const win=gagner(tour); board[i]=null; return win; }); if(gagnantPossible!==undefined){ choixIA=gagnantPossible; }else{ choixIA= coups[Math.floor(Math.random()*coups.length)]; } board[choixIA]=tour; afficher(); if(gagner(tour)){ terminer( tour===choix?"gagne":"perdu", tour===choix ? "🏆 Vous avez gagné !" : "💀 Votre adversaire gagne !" ); return; } if(coupsPossibles().length===0){ terminer("nul","🤝 Match nul !"); return; } tour=tour==="X"?"O":"X"; status.textContent= "Tour automatique : "+tour; setTimeout(jouerAutomatiquement,700);}async function terminer(etat, message){ termine=true; try{ const gagne=(etat!=="perdu"); const mult=(etat==="nul")?1:2; const resReq=await fetch("/api/paris/resoudre",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,betId,gagne,multiplicateur:mult})}); const resData=await resReq.json(); if(resData.success){ document.getElementById("solde").textContent="Solde : "+resData.wallet.points.toLocaleString("fr-FR")+" pts"; if(etat==="gagne"){ message+=" Gain : "+resData.gain+" pts."; afficherPopupGain(resData.gain); } else if(etat==="nul"){ message+=" Mise remboursée."; } } }catch(erreurResolution){ console.error(erreurResolution); } document.getElementById("resultat").textContent=message; document.getElementById("gameOver").style.display="flex"; status.textContent="Partie terminée";}
function afficherPopupGain(gain){ const popup=document.createElement("div"); popup.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:9999;"; popup.innerHTML=`<div style="background:#111b2b;border:1px solid #25344c;border-radius:15px;padding:30px;text-align:center;max-width:320px;font-family:inherit;color:#fff;"><div style="font-size:42px;">🎉</div><h3 style="margin:12px 0;">Vous avez gagné ${gain.toLocaleString("fr-FR")} points !</h3><p style="color:#8996aa;font-size:13px;">Ajoutés automatiquement à votre solde.</p><button id="fermerPopupGain" style="margin-top:15px;padding:10px 25px;border:none;border-radius:8px;background:#20ff78;color:#000;font-weight:bold;cursor:pointer;">OK</button></div>`; document.body.appendChild(popup); document.getElementById("fermerPopupGain").addEventListener("click",()=>popup.remove()); }afficher();setTimeout(jouerAutomatiquement,1000);})();</script></body></html>
