<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tournoi</title><style>body{background:#000;color:#fff;font-family:Arial;margin:0}.container{max-width:520px;margin:auto;padding:20px}.card{background:#121212;border:1px solid #222;border-radius:12px;padding:18px;margin-bottom:18px}h2,h3{color:#00ff66}.game{padding:10px;background:#1a1a1a;border-radius:8px;margin:7px 0}.btn{width:100%;padding:13px;border:0;border-radius:8px;background:#00ff66;font-weight:800;cursor:pointer}.secondary{background:#333;color:#fff}.msg{margin-top:10px;text-align:center}.ok{color:#00ff66}.err{color:#ff3040}.match{padding:12px;background:#1a1a1a;border-left:3px solid #00ff66;border-radius:8px;margin:8px 0}</style></head><body><div class="container"><h2>🏆 Tournoi</h2><div class="card"><div>🎯 Mes points</div><strong id="points">Chargement...</strong><p>Inscription : 3 000 pts</p></div><div class="card"><h3>1. S'inscrire</h3><label><input type="checkbox" value="dame" checked> ♟️ Dame</label><br><label><input type="checkbox" value="echecs"> ♞ Échecs</label><br><label><input type="checkbox" value="morpion"> ❌⭕ Morpion</label><br><label><input type="checkbox" value="puissance4"> 🔵 Puissance 4</label><button id="join" class="btn" style="margin-top:12px">S'inscrire — 3 000 pts</button><div id="reg" class="msg"></div></div><div class="card"><h3>2. Mes matchs</h3><div id="matches">Chargement...</div><button id="play" class="btn secondary">Jouer maintenant</button><div id="msg" class="msg"></div></div></div><script>const token=localStorage.getItem('gameonline_token');if(!token)location='/login.html';const $=x=>document.getElementById(x);async function points(){try{const r=await fetch('/api/player/balance?token='+encodeURIComponent(token));const d=await r.json();$('points').textContent=Number(d.points||0).toLocaleString('fr-FR')+' pts';return Number(d.points||0)}catch(e){$('points').textContent='Erreur';return 0}}async function load(){try{const r=await fetch('/api/programme?token='+encodeURIComponent(token),{cache:'no-store'});const d=await r.json();const mine=d.matches.filter(m=>m.round===d.round&&m.canEnter&&!m.played);if(!mine.length){$('matches').innerHTML='<span style="color:#888">Aucun match ouvert actuellement.</span>';return} $('matches').innerHTML=mine.map(m=>`<div class="match">${m.gameType} — Round ${m.round}<br><strong>${m.p1.firstname} ${m.p1.name}</strong> VS <strong>${m.p2.firstname} ${m.p2.name}</strong><br><small>Ouverture : ${new Date(m.datetime).toLocaleString('fr-FR',{timeZone:'Africa/Kinshasa'})}</small></div>`).join('')}catch(e){$('matches').textContent='Erreur chargement'}}$('join').onclick=async()=>{const games=[...document.querySelectorAll('input[type=checkbox]:checked')].map(x=>x.value);$('reg').textContent='Inscription...';try{const r=await fetch('/api/tournament/join',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,games})});const d=await r.json();$('reg').className='msg '+(r.ok?'ok':'err');$('reg').textContent=d.message||d.error||'Réponse serveur';await points();await load()}catch(e){$('reg').className='msg err';$('reg').textContent='Serveur injoignable'}};$('play').onclick=async()=>{try{const r=await fetch('/api/tournament/enter-match',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});const d=await r.json();if(d.success){location.href=d.page+'?matchId='+encodeURIComponent(d.matchId)+'&token='+encodeURIComponent(token)}else{$('msg').className='msg err';$('msg').textContent=d.error||'Aucun match ouvert'}}catch(e){$('msg').className='msg err';$('msg').textContent='Serveur injoignable'}};points();load();setInterval(load,15000);</script></body></html>
