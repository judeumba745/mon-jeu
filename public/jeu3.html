<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>PARIS - Dames</title><style>*{box-sizing:border-box}body{ margin:0; min-height:100vh; background:#07100b; color:white; font-family:Arial,sans-serif; display:flex; justify-content:center; align-items:center;}.container{ width:95%; max-width:650px; text-align:center;}h1{ color:#20ff78; margin-bottom:8px;}.info{ display:flex; justify-content:space-between; background:#101722; padding:12px; border-radius:12px; margin-bottom:15px;}#plateau{ width:min(92vw,560px); height:min(92vw,560px); margin:auto; display:grid; grid-template-columns:repeat(8,1fr); border:5px solid #20ff78;}.case{ aspect-ratio:1; display:flex; justify-content:center; align-items:center;}.clair{background:#e4c88a}.fonce{background:#4b2d1d}.pion{ width:70%; height:70%; border-radius:50%; border:3px solid white; box-shadow:0 5px 10px #000; display:flex; align-items:center; justify-content:center; font-size:25px;}.rouge{background:#e53935}.noir{background:#111}.reine{ border-color:#ffd700;}#status{ margin:15px; color:#20ff78; font-weight:bold;}#gameOver{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.85); justify-content:center; align-items:center; flex-direction:column; z-index:20;}#gameOver h2{ font-size:35px; color:#20ff78;}button{ padding:12px 25px; border:0; border-radius:10px; background:#20ff78; font-weight:bold;}</style><script>(function () { const navigation = performance.getEntriesByType('navigation')[0]; // Actualisation
if (navigation && navigation.type === 'reload') { window.location.replace('/Paris.html'); return; } // Navigation directe vers la page
if (!document.referrer || !document.referrer.includes('Paris.html')) { window.location.replace('/Paris.html'); }})();</script> </head><body><div class="container"><h1>♟️ PARIS — DAMES</h1><div class="info"> <span id="joueur">Joueur : Chargement...</span> <span id="mise">Mise : 0 pts</span> <span id="solde">Solde : -- pts</span></div><div id="plateau"></div><div id="status">La partie commence...</div></div><div id="gameOver"> <h2 id="resultat"></h2> <button onclick="location.href='index.html'">Retour</button></div><script>(async function(){ const params = new URLSearchParams(location.search);const choix = params.get("choix") || "rouge";const mise = Math.floor(Number(params.get("mise") || 0));const token=localStorage.getItem("gameonline_token"); let betId=null; if(!token || mise<=0){ alert("Session invalide ou mise incorrecte."); window.location.href="/Paris.html"; return; } try{ const miseRes=await fetch("/api/paris/mise",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,jeu:"dames",mise})}); const miseData=await miseRes.json(); if(!miseData.success){ alert("❌ "+(miseData.error||"Mise refusée.")); window.location.href="/Paris.html"; return; } betId=miseData.betId; document.getElementById("solde").textContent="Solde : "+miseData.wallet.points.toLocaleString("fr-FR")+" pts"; }catch(erreurMise){ alert("❌ Erreur de connexion au serveur."); window.location.href="/Paris.html"; return; } document.getElementById("joueur").textContent = "Joueur : " + (choix === "noir" ? "Bleu" : "🔴 Rouge");document.getElementById("mise").textContent = "Mise : " + mise + " pts";const plateau = document.getElementById("plateau");const status = document.getElementById("status");let board = [];let tour = "rouge";let termine = false;function initialiser(){ board = Array(8).fill(null).map(()=>Array(8).fill(null)); for(let r=0;r<8;r++){ for(let c=0;c<8;c++){ if((r+c)%2===1){ if(r<3) board[r][c]="noir"; if(r>4) board[r][c]="rouge"; } } } afficher();}function afficher(){ plateau.innerHTML=""; for(let r=0;r<8;r++){ for(let c=0;c<8;c++){ const cell=document.createElement("div"); cell.className = "case " + ((r+c)%2===0 ? "clair":"fonce"); const piece=board[r][c]; if(piece){ const pion=document.createElement("div"); pion.className="pion "+piece; if(piece==="rouge" && r===0){ pion.classList.add("reine"); pion.textContent="👑"; } if(piece==="noir" && r===7){ pion.classList.add("reine"); pion.textContent="👑"; } cell.appendChild(pion); } plateau.appendChild(cell); } }}function pieces(couleur){ const liste=[]; for(let r=0;r<8;r++){ for(let c=0;c<8;c++){ if(board[r][c]===couleur){ liste.push({r,c}); } } } return liste;}function mouvements(piece){ const {r,c}=piece; const couleur=board[r][c]; const dirs = couleur==="rouge" ? [[-1,-1],[-1,1]] : [[1,-1],[1,1]]; const moves=[]; for(const [dr,dc] of dirs){ const nr=r+dr; const nc=c+dc; if(nr>=0 && nr<8 && nc>=0 && nc<8 && !board[nr][nc]){ moves.push({ from:{r,c}, to:{r:nr,c:nc} }); } const jr=r+dr*2; const jc=c+dc*2; if(jr>=0 && jr<8 && jc>=0 && jc<8 && board[nr]?.[nc] && board[nr][nc]!==couleur && !board[jr][jc]){ moves.push({ from:{r,c}, to:{r:jr,c:jc}, capture:{r:nr,c:nc} }); } } return moves;}function tousLesCoups(couleur){ let result=[]; for(const p of pieces(couleur)){ result=result.concat(mouvements(p)); } return result;}function jouer(coup){ const p=board[coup.from.r][coup.from.c]; board[coup.from.r][coup.from.c]=null; board[coup.to.r][coup.to.c]=p; if(coup.capture){ board[coup.capture.r][coup.capture.c]=null; } if(p==="rouge" && coup.to.r===0){ board[coup.to.r][coup.to.c]="rouge"; } if(p==="noir" && coup.to.r===7){ board[coup.to.r][coup.to.c]="noir"; }}function tourAutomatique(){ if(termine)return; const coups=tousLesCoups(tour); if(coups.length===0){ terminer( (tour==="rouge"?"noir":"rouge")===choix, tour==="rouge" ? "🏆 Noir gagne !" : "🏆 Rouge gagne !" ); return; } const captures=coups.filter(c=>c.capture); const liste=captures.length ? captures : coups; const coup=liste[Math.floor(Math.random()*liste.length)]; jouer(coup); afficher(); if(pieces("rouge").length===0){ terminer( choix==="noir", "🏆 Noir gagne !"); return; } if(pieces("noir").length===0){ terminer( choix==="rouge", "🏆 Rouge gagne !"); return; } tour=tour==="rouge"?"noir":"rouge"; status.textContent = "Tour automatique : " + (tour==="rouge"?"🔴 Rouge":"⚫ Noir"); setTimeout(tourAutomatique,900);}async function terminer(gagne, message){ termine=true; try{ const resReq=await fetch("/api/paris/resoudre",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,betId,gagne,multiplicateur:2})}); const resData=await resReq.json(); if(resData.success){ document.getElementById("solde").textContent="Solde : "+resData.wallet.points.toLocaleString("fr-FR")+" pts"; if(gagne){ message+=" Gain : "+resData.gain+" pts."; afficherPopupGain(resData.gain); } } }catch(erreurResolution){ console.error(erreurResolution); } document.getElementById("resultat").textContent=message; document.getElementById("gameOver").style.display="flex"; status.textContent="Partie terminée";}
function afficherPopupGain(gain){ const popup=document.createElement("div"); popup.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:9999;"; popup.innerHTML=`<div style="background:#111b2b;border:1px solid #25344c;border-radius:15px;padding:30px;text-align:center;max-width:320px;font-family:inherit;color:#fff;"><div style="font-size:42px;">🎉</div><h3 style="margin:12px 0;">Vous avez gagné ${gain.toLocaleString("fr-FR")} points !</h3><p style="color:#8996aa;font-size:13px;">Ajoutés automatiquement à votre solde.</p><button id="fermerPopupGain" style="margin-top:15px;padding:10px 25px;border:none;border-radius:8px;background:#20ff78;color:#000;font-weight:bold;cursor:pointer;">OK</button></div>`; document.body.appendChild(popup); document.getElementById("fermerPopupGain").addEventListener("click",()=>popup.remove()); }initialiser();setTimeout(tourAutomatique,1000);})();</script></body></html>
