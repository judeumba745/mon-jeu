<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morpion - IA & Multijoueur</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #f0f0f0;
      margin: 0;
      padding: 20px;
    }
    h1 { text-align: center; }
    .board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      grid-template-rows: repeat(3, 100px);
      gap: 5px;
      margin-top: 20px;
    }
    .cell {
      background: #fff;
      border: 2px solid #333;
      font-size: 3em;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    button { margin: 10px; padding: 10px 20px; font-size: 1em; }
    #status { margin-top: 20px; font-size: 1.2em; }
  </style>
</head>
<body>
  <h1>Morpion</h1>
  <div>
    <button id="playAI">Jouer contre IA</button>
    <button id="playOnline">Jouer en ligne</button>
  </div>
  <div class="board" id="board"></div>
  <div id="status"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="jeu2.js"></script>
</body>
</html>
