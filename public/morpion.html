<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Morpion</title>
<style>
body { background: #0a0a0a; color: #fff; font-family: Arial; display: flex; flex-direction: column; align-items: center; padding: 20px; }
#mode-badge { padding: 10px 20px; border-radius: 8px; font-weight: bold; margin-bottom: 15px; background: #1e40af; }
#status { font-size: 20px; margin: 15px 0; }
#plateau { display: grid; grid-template-columns: repeat(3, 100px); gap: 5px; background: #d4af37; padding: 5px; border-radius: 10px; }
.case { width: 100px; height: 100px; background: #111; display: flex; align-items: center; justify-content: center; font-size: 60px; font-weight: bold; cursor: pointer; }
.case:hover { background: #222; }
#gameOver { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; font-size: 40px; font-weight: bold; z-index: 100; }
</style>
<script>(function () {  const navigation = performance.getEntriesByType('navigation')[0];  // Actualisation  if (navigation && navigation.type === 'reload') {    window.location.replace('/Paris.html');    return;  }  // Navigation directe vers la page  if (!document.referrer || !document.referrer.includes('Paris.html')) {    window.location.replace('/Paris.html');  }})();</script>
</head>
<body>
<div id="mode-badge">Mode : Morpion</div>
<div id="status">Tour de X</div>
<div id="plateau"></div>
<div id="gameOver"></div>
<script src="morpion.js"></script>
</body>
</html>
