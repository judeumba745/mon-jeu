<!DOCTYPE html> <html lang="fr"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width,initial-scale=1.0"> <title>Aviator</title> <style> *{ box-sizing:border-box; margin:0; padding:0; } body{ min-height:100vh; font-family:Arial,Helvetica,sans-serif; background: radial-gradient(circle at 50% 0%,#17345c 0%,#08111f 42%,#03070d 100%); color:#fff; overflow-x:hidden; } .header{ height:70px; display:flex; align-items:center; justify-content:space-between; padding:0 18px; background:rgba(3,9,18,.88); border-bottom:1px solid rgba(255,255,255,.08); position:sticky; top:0; z-index:20; } .logo{ font-size:22px; font-weight:900; } .logo span{ color:#ffb000; } .balance{ background:#101d2d; border:1px solid #263b54; padding:10px 15px; border-radius:12px; font-weight:800; } .back{ position:fixed; left:15px; bottom:15px; z-index:30; text-decoration:none; color:#fff; background:#17283d; border:1px solid #304863; padding:11px 17px; border-radius:12px; } .game{ width:min(1100px,94%); margin:25px auto 90px; } .stage{ height:500px; position:relative; overflow:hidden; border-radius:25px; background: linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px), linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px), linear-gradient(145deg,#0c1e34,#050a12); background-size:50px 50px,50px 50px,100% 100%; border:1px solid #263d58; box-shadow:0 25px 80px rgba(0,0,0,.45); } .stage:after{ content:""; position:absolute; width:700px; height:700px; border-radius:50%; border:1px solid rgba(255,255,255,.05); left:-180px; bottom:-520px; } .multiplier{ position:absolute; inset:0; display:flex; justify-content:center; align-items:center; padding-bottom:60px; font-size:clamp(52px,11vw,110px); font-weight:1000; letter-spacing:-5px; color:#fff; text-shadow:0 0 35px rgba(255,176,0,.28); z-index:5; } .multiplier.crashed{ color:#ff4757; text-shadow:0 0 35px rgba(255,71,87,.35); } .plane{ position:absolute; left:-90px; bottom:85px; font-size:55px; transform:rotate(-14deg); z-index:6; filter:drop-shadow(0 0 15px rgba(255,176,0,.4)); } .plane.fly{ animation:fly 7s linear forwards; } @keyframes fly{ 0%{ left:-90px; bottom:70px; } 100%{ left:90%; bottom:78%; } } .trail{ position:absolute; height:3px; width:0; left:0; bottom:80px; background:linear-gradient(90deg,transparent,#ffb000); box-shadow:0 0 12px #ffb000; } .trail.fly{ animation:trail 7s linear forwards; } @keyframes trail{ from{width:0} to{width:90%} } .status{ position:absolute; left:50%; transform:translateX(-50%); bottom:20px; background:rgba(0,0,0,.45); padding:9px 18px; border-radius:30px; font-size:14px; color:#b7c6d8; z-index:8; } .controls{ margin-top:18px; display:grid; grid-template-columns:1fr auto; gap:15px; } .panel{ background:#0b1727; border:1px solid #233b55; border-radius:18px; padding:18px; } label{ display:block; color:#8fa3b8; font-size:13px; margin-bottom:8px; } input{ width:100%; background:#06101d; border:1px solid #2b435e; border-radius:12px; color:white; padding:15px; outline:none; font-size:17px; } input:focus{ border-color:#ffb000; } .buttons{ display:flex; gap:10px; margin-top:12px; } button{ border:0; border-radius:12px; padding:14px 20px; font-size:15px; font-weight:900; cursor:pointer; } .bet{ background:#ffb000; color:#111; min-width:150px; } .cash{ background:#18c77a; color:#04120b; min-width:150px; } button:disabled{ opacity:.35; cursor:not-allowed; } .info{ min-width:230px; display:flex; flex-direction:column; justify-content:center; gap:9px; } .row{ display:flex; justify-content:space-between; color:#91a5b9; } .row strong{ color:#fff; } .history{ margin-top:18px; } .history-title{ font-size:17px; font-weight:900; margin-bottom:10px; } .history-list{ display:flex; flex-wrap:wrap; gap:8px; } .crash-item{ padding:8px 12px; border-radius:9px; background:#28141a; color:#ff6875; font-weight:900; font-size:13px; } .notice{ margin-top:15px; padding:12px; border-radius:12px; background:#0b1b2c; border:1px solid #213a53; color:#8fa4b9; font-size:12px; line-height:1.5; } @media(max-width:700px){ .controls{ grid-template-columns:1fr; } .stage{ height:420px; } .buttons{ flex-direction:column; } button{ width:100%; } .info{ min-height:130px; } } </style> <script>(function () { const navigation = performance.getEntriesByType('navigation')[0]; // Actualisation
if (navigation && navigation.type === 'reload') { window.location.replace('/Paris.html'); return; } // Navigation directe vers la page
if (!document.referrer || !document.referrer.includes('Paris.html')) { window.location.replace('/Paris.html'); }})();</script> </head> <body> <header class="header"> <div class="logo">✈️ <span>AVIATOR</span></div> <div class="balance"> Points : <span id="balance">10000</span> </div> </header> <main class="game"> <section class="stage"> <div id="multiplier" class="multiplier">1.00×</div> <div id="plane" class="plane">✈️</div> <div id="trail" class="trail"></div> <div id="status" class="status"> Préparation de la prochaine manche... </div> </section> <section class="controls"> <div class="panel"> <label for="betAmount">Votre mise</label> <input id="betAmount" type="number" min="1" step="1" value="100" > <div class="buttons"> <button id="betButton" class="bet"> MISER </button> <button id="cashButton" class="cash" disabled> RETIRER </button> </div> </div> <div class="panel info"> <div class="row"> <span>Mise</span> <strong id="currentBet">0</strong> </div> <div class="row"> <span>Gain potentiel</span> <strong id="potential">0</strong> </div> <div class="row"> <span>Crash</span> <strong id="crashPoint">—</strong> </div> </div> </section> <section class="panel history"> <div class="history-title"> Derniers crashs </div> <div id="history" class="history-list"></div> </section> <div class="notice"> Démonstration avec points virtuels. Dans la version serveur, le crash, les mises et les gains devront être contrôlés exclusivement par le serveur. </div> </main> <a class="back" href="paris.html">← Retour</a> <script> const balanceEl = document.getElementById("balance"); const betAmountEl = document.getElementById("betAmount"); const betButton = document.getElementById("betButton"); const cashButton = document.getElementById("cashButton"); const multiplierEl = document.getElementById("multiplier"); const statusEl = document.getElementById("status"); const currentBetEl = document.getElementById("currentBet"); const potentialEl = document.getElementById("potential"); const crashPointEl = document.getElementById("crashPoint"); const planeEl = document.getElementById("plane"); const trailEl = document.getElementById("trail"); const historyEl = document.getElementById("history"); let balance = 0; let currentBet = 0; let currentBetId = null; let multiplier = 1; let crashPoint = 1.50; let playing = false; let crashed = false; let cashedOut = false; let timer = null; const token = localStorage.getItem("gameonline_token"); function format(n){ return Math.floor(n).toLocaleString("fr-FR"); } function updateBalance(){ balanceEl.textContent = format(balance); } function createCrashPoint(){ const value = 150 + Math.floor(Math.random() * 6); return value / 100; } function addHistory(value){ const item = document.createElement("div"); item.className = "crash-item"; item.textContent = value.toFixed(2) + "×"; historyEl.prepend(item); while(historyEl.children.length > 12){ historyEl.lastElementChild.remove(); } } function resetVisual(){ multiplier = 1; multiplierEl.textContent = "1.00×"; multiplierEl.classList.remove("crashed"); planeEl.classList.remove("fly"); trailEl.classList.remove("fly"); void planeEl.offsetWidth; planeEl.classList.add("fly"); trailEl.classList.add("fly"); } function startRound(){ playing = true; crashed = false; cashedOut = false; currentBet = 0; currentBetId = null; crashPoint = createCrashPoint(); currentBetEl.textContent = "0"; potentialEl.textContent = "0"; crashPointEl.textContent = "—"; betButton.disabled = false; cashButton.disabled = true; statusEl.textContent = "Les mises sont ouvertes"; resetVisual(); setTimeout(()=>{ if(playing){ startFlight(); } },1800); } function startFlight(){ statusEl.textContent = "La manche est lancée !"; betButton.disabled = true; const start = Date.now(); timer = setInterval(()=>{ const elapsed = (Date.now() - start) / 1000; multiplier = 1 + elapsed * 0.14; multiplier = Number(multiplier.toFixed(2)); if(multiplier >= crashPoint){ multiplier = crashPoint; crash(); return; } multiplierEl.textContent = multiplier.toFixed(2) + "×"; if(currentBet > 0 && !cashedOut){ potentialEl.textContent = format(currentBet * multiplier); } },100); } function crash(){ clearInterval(timer); playing = false; crashed = true; multiplierEl.textContent = crashPoint.toFixed(2) + "×"; multiplierEl.classList.add("crashed"); statusEl.textContent = "💥 CRASH à " + crashPoint.toFixed(2) + "×"; crashPointEl.textContent = crashPoint.toFixed(2) + "×"; cashButton.disabled = true; if(currentBet > 0 && !cashedOut){ statusEl.textContent += " — Vous avez perdu votre mise."; fetch("/api/paris/resoudre", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ token, betId: currentBetId, gagne:false }) }).catch(()=>{}); } addHistory(crashPoint); setTimeout(startRound,4000); } async function placeBet(){ if(!playing || currentBet > 0){ return; } const amount = Math.floor(Number(betAmountEl.value)); if(!Number.isFinite(amount) || amount <= 0){ alert("Entrez une mise valide."); return; } if(!token){ alert("Session invalide, reconnectez-vous."); return; } betButton.disabled = true; try{ const miseRes = await fetch("/api/paris/mise", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ token, jeu:"aviator", mise: amount }) }); const miseData = await miseRes.json(); if(!miseData.success){ alert("❌ " + (miseData.error || "Mise refusée.")); betButton.disabled = playing; return; } currentBetId = miseData.betId; balance = miseData.wallet.points; }catch(erreurMise){ alert("❌ Erreur de connexion au serveur."); betButton.disabled = playing; return; } currentBet = amount; updateBalance(); currentBetEl.textContent = format(amount); potentialEl.textContent = format(amount); cashButton.disabled = false; statusEl.textContent = "Mise acceptée : " + format(amount) + " points"; } async function cashOut(){ if(!playing || currentBet <= 0 || cashedOut){ return; } if(multiplier >= crashPoint){ return; } cashedOut = true; cashButton.disabled = true; const multAuMoment = multiplier; try{ const resReq = await fetch("/api/paris/resoudre", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ token, betId: currentBetId, gagne: true, multiplicateur: multAuMoment }) }); const resData = await resReq.json(); if(resData.success){ balance = resData.wallet.points; updateBalance(); potentialEl.textContent = format(resData.gain); statusEl.textContent = "✅ Retrait à " + multAuMoment.toFixed(2) + "× — Gain : " + format(resData.gain) + " points"; afficherPopupGain(resData.gain); } }catch(erreurResolution){ statusEl.textContent = "Erreur lors du retrait."; } currentBet = 0; }
function afficherPopupGain(gain){ const popup=document.createElement("div"); popup.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:9999;"; popup.innerHTML=`<div style="background:#111b2b;border:1px solid #25344c;border-radius:15px;padding:30px;text-align:center;max-width:320px;font-family:inherit;color:#fff;"><div style="font-size:42px;">🎉</div><h3 style="margin:12px 0;">Vous avez gagné ${gain.toLocaleString("fr-FR")} points !</h3><p style="color:#8996aa;font-size:13px;">Ajoutés automatiquement à votre solde.</p><button id="fermerPopupGain" style="margin-top:15px;padding:10px 25px;border:none;border-radius:8px;background:#20ff78;color:#000;font-weight:bold;cursor:pointer;">OK</button></div>`; document.body.appendChild(popup); document.getElementById("fermerPopupGain").addEventListener("click",()=>popup.remove()); } betButton.addEventListener("click",placeBet); cashButton.addEventListener("click",cashOut);
(async function(){
  if(!token){ alert("Session invalide, reconnectez-vous."); window.location.href="/Paris.html"; return; }

    const balRes = await fetch("/api/player/balance?token="+encodeURIComponent(token));
    const balData = await balRes.json();
    balance = balData.points ?? balData.balance ?? balData.player?.points ?? 0;
  }catch(erreurSolde){ balance = 0; }
  updateBalance();

})(); </script> </body> </html>
