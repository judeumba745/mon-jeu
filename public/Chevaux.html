<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Course de chevaux - Paris Game Center</title><style>* { box-sizing: border-box;}body { margin: 0; font-family: Arial, sans-serif; background: radial-gradient(circle at top, #182536, #060a10 70%); color: white; min-height: 100vh;}.header { padding: 18px 25px; display: flex; justify-content: space-between; align-items: center; background: rgba(5,10,17,.95); border-bottom: 1px solid #263344;}.logo { display: flex; align-items: center; gap: 10px;}.logo-icon { font-size: 35px;}.logo h1 { margin: 0; color: #20ff78; font-size: 20px;}.logo p { margin: 2px 0 0; font-size: 11px; color: #8995a5;}.solde { color: #20ff78; font-weight: bold;}.container { width: 95%; max-width: 1100px; margin: 25px auto;}.top { text-align: center;}.top h2 { margin-bottom: 5px;}.top p { color: #9aa6b6;}.info { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin: 20px 0;}.info-box { background: #121b27; padding: 12px 20px; border-radius: 12px; border: 1px solid #253345;}.info-box strong { color: #20ff78;}.compteur { text-align: center; font-size: 38px; font-weight: bold; color: #20ff78; margin: 20px; min-height: 45px;}/* ========================= PISTE========================= */.race { position: relative; background: #0e1722; border: 1px solid #273548; border-radius: 18px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.35);}.ligne { height: 110px; position: relative; border-bottom: 2px dashed #344456; overflow: hidden; background: repeating-linear-gradient( 90deg, #15202b 0, #15202b 70px, #182633 70px, #182633 140px );}.ligne:last-child { border-bottom: none;}/* LIGNES DE DISTANCE */.ligne::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient( 90deg, transparent 0, transparent 80px, rgba(255,255,255,.12) 81px, rgba(255,255,255,.12) 84px, transparent 85px, transparent 160px ); background-position: 0 0; animation: pisteDefile .30s linear infinite; animation-play-state: paused; pointer-events: none; z-index: 2;}@keyframes pisteDefile { from { background-position: 0 0; } to { background-position: -160px 0; }}/* Les lignes commencent uniquement après GO */.race.course-active .ligne::after { animation-play-state: running;}/* Quand la course est terminée : STOP */.race.course-finished .ligne::after { animation-play-state: paused;}/* ========================= NOM========================= */.nom-cheval { position: absolute; left: 10px; top: 10px; font-weight: bold; z-index: 7; text-shadow: 0 2px 4px #000;}/* ========================= CHEVAL========================= */.cheval { position: absolute; left: 10px; bottom: 17px; font-size: 48px; z-index: 8; /* Le cheval regarde vers la DROITE. Le déplacement reste vers la droite. */ transform: scaleX(-1); will-change: left;}/* Sabots animés seulement pendant la course.*/.race.course-active .cheval { animation: chevalCourse .14s ease-in-out infinite alternate;}@keyframes chevalCourse { from { margin-top: 0; } to { margin-top: -5px; }}/* Course terminée : aucune animation.*/.race.course-finished .cheval { animation: none !important;}/* ========================= ARRIVÉE========================= */.arrivee { position: absolute; right: 35px; top: 0; height: 100%; width: 14px; background: repeating-linear-gradient( 45deg, white 0, white 10px, black 10px, black 20px ); z-index: 6;}/* ========================= CHEVAL JOUEUR========================= */.cheval.joueur { filter: drop-shadow(0 0 18px #20ff78);}/* ========================= RESULTAT========================= */.resultat { display: none; text-align: center; background: #111c28; border: 1px solid #20ff78; border-radius: 18px; padding: 25px; margin-top: 25px;}.resultat h2 { margin-top: 0;}.classement { margin-top: 20px;}.place { background: #172332; border: 1px solid #2b3b4e; border-radius: 10px; padding: 12px; margin: 8px auto; max-width: 450px; font-weight: bold;}.place.premier { border-color: #20ff78; box-shadow: 0 0 15px rgba(32,255,120,.2);}.message { color: #b8c2ce;}.btn { border: none; background: #20ff78; color: #06100a; padding: 14px 25px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 15px;}@media(max-width:600px) { .header { padding: 15px; } .ligne { height: 90px; } .cheval { font-size: 38px; }}</style><script>(function () { const navigation = performance.getEntriesByType('navigation')[0]; // Actualisation
if (navigation && navigation.type === 'reload') { window.location.replace('/Paris.html'); return; } // Navigation directe vers la page
if (!document.referrer || !document.referrer.includes('Paris.html')) { window.location.replace('/Paris.html'); }})();</script> </head><body><header class="header"> <div class="logo"> <div class="logo-icon"> 🏇 </div> <div> <h1>PARIS</h1> <p>GAME CENTER</p> </div> </div> <div class="solde"> 💰 <span id="solde">--</span> </div></header><div class="container"> <div class="top"> <h2>🏇 Course de chevaux</h2> <p> Choisissez votre cheval et regardez le classement. </p> </div> <div class="info"> <div class="info-box"> Votre cheval : <strong id="monCheval">---</strong> </div> <div class="info-box"> Pari : <strong id="mise">---</strong> </div> </div> <div class="compteur" id="compteur"> 3 </div> <div class="race" id="race"> <div class="ligne"> <div class="nom-cheval"> 🏇 Cheval 1 </div> <div class="cheval" id="cheval1"> 🏇 </div> <div class="arrivee"></div> </div> <div class="ligne"> <div class="nom-cheval"> 🏇 Cheval 2 </div> <div class="cheval" id="cheval2"> 🏇 </div> <div class="arrivee"></div> </div> <div class="ligne"> <div class="nom-cheval"> 🏇 Cheval 3 </div> <div class="cheval" id="cheval3"> 🏇 </div> <div class="arrivee"></div> </div> <div class="ligne"> <div class="nom-cheval"> 🏇 Cheval 4 </div> <div class="cheval" id="cheval4"> 🏇 </div> <div class="arrivee"></div> </div> </div> <div class="resultat" id="resultat"> <h2>🏆 Classement final</h2> <p class="message" id="messageResultat"></p> <div class="classement" id="classement"></div> <button class="btn" onclick="window.location.href='index.html'" > 🎮 Retour aux jeux </button> </div></div><script>document.addEventListener("DOMContentLoaded", async () => { const params = new URLSearchParams( window.location.search ); const choix = params.get("choix") || "cheval1"; const mise = Math.floor(Number(params.get("mise"))) || 0; const token = localStorage.getItem("gameonline_token"); document.getElementById("monCheval") .textContent = choix.replace( "cheval", "Cheval " ); document.getElementById("mise") .textContent = mise.toLocaleString("fr-FR") + " pts"; /* ========================= SOLDE (SERVEUR - la mise est réellement débitée ici) ========================= */ let solde = 0; let betId = null; if (!token || mise <= 0) { alert("Session invalide ou mise incorrecte."); window.location.href = "/Paris.html"; return; } try { const miseRes = await fetch("/api/paris/mise", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token, jeu: "cheval", mise }) }); const miseData = await miseRes.json(); if (!miseData.success) { alert("❌ " + (miseData.error || "Mise refusée.")); window.location.href = "/Paris.html"; return; } betId = miseData.betId; solde = miseData.wallet.points; } catch (erreurMise) { alert("❌ Erreur de connexion au serveur."); window.location.href = "/Paris.html"; return; } document.getElementById("solde") .textContent = solde.toLocaleString("fr-FR") + " pts"; /* ========================= CHEVAUX ========================= */ const chevaux = [ { id: "cheval1", element: document.getElementById("cheval1"), position: 0, vitesse: 0 }, { id: "cheval2", element: document.getElementById("cheval2"), position: 0, vitesse: 0 }, { id: "cheval3", element: document.getElementById("cheval3"), position: 0, vitesse: 0 }, { id: "cheval4", element: document.getElementById("cheval4"), position: 0, vitesse: 0 } ]; const joueur = chevaux.find( cheval => cheval.id === choix ); if (joueur) { joueur.element.classList.add("joueur"); } /* ========================= COMPTE À REBOURS ========================= */ let compteur = 3; const compteurElement = document.getElementById("compteur"); const countdown = setInterval(() => { compteur--; if (compteur > 0) { compteurElement.textContent = compteur; } else { compteurElement.textContent = "GO!"; clearInterval(countdown); /* LES LIGNES COMMENCENT EXACTEMENT À GO. */ document .getElementById("race") .classList.add( "course-active" ); setTimeout( commencerCourse, 250 ); } }, 1000); /* ========================= COURSE ========================= */ function commencerCourse() { const race = document.getElementById("race"); const largeur = race.clientWidth; /* Position maximale. */ const distance = largeur - 105; /* Vitesses initiales. */ chevaux.forEach(cheval => { cheval.vitesse = 4.5 + Math.random() * 2.5; }); let classement = []; let courseActive = true; const interval = setInterval(() => { if (!courseActive) { return; } chevaux.forEach(cheval => { /* Si déjà arrivé, il reste arrêté. */ if ( classement.includes( cheval.id ) ) { return; } /* Variation légère. */ cheval.vitesse += ( Math.random() - 0.5 ) * 0.18; if (cheval.vitesse < 4) { cheval.vitesse = 4; } if (cheval.vitesse > 8.5) { cheval.vitesse = 8.5; } /* AVANCE TOUJOURS VERS LA DROITE. */ cheval.position += cheval.vitesse; if ( cheval.position >= distance ) { cheval.position = distance; /* On enregistre immédiatement sa place. */ classement.push( cheval.id ); } cheval.element.style.left = cheval.position + "px"; }); /* Les 4 sont arrivés. */ if (classement.length === 4) { courseActive = false; clearInterval(interval); /* STOP TOTAL. */ race.classList.remove( "course-active" ); race.classList.add( "course-finished" ); afficherResultat( classement ); } }, 60); } /* ========================= RESULTAT ========================= */ async function afficherResultat( classement ) { const resultat = document.getElementById( "resultat" ); const classementElement = document.getElementById( "classement" ); const message = document.getElementById( "messageResultat" ); classementElement.innerHTML = ""; const symboles = [ "🥇", "🥈", "🥉", "4️⃣" ]; classement.forEach( (id, index) => { const div = document.createElement( "div" ); div.className = "place"; if (index === 0) { div.classList.add( "premier" ); } const nom = id.replace( "cheval", "Cheval " ); div.textContent = symboles[index] + " " + (index + 1) + " — " + nom; classementElement .appendChild(div); } ); /* Le premier est déterminé par classement[0]. */ const premier = classement[0]; const gagne = (premier === choix); try { const resReq = await fetch("/api/paris/resoudre", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token, betId, gagne, multiplicateur: 2 }) }); const resData = await resReq.json(); if (resData.success) { solde = resData.wallet.points; if (gagne) { message.textContent = "🎉 Votre cheval est arrivé 1er ! Gain : " + resData.gain + " pts."; afficherPopupGain(resData.gain); } else { message.textContent = "Votre cheval est arrivé " + ( classement.indexOf(choix) + 1 ) + "e. Le gagnant est " + premier.replace( "cheval", "Cheval " ) + "."; } } else { message.textContent = "Erreur lors du règlement : " + (resData.error || ""); } } catch (erreurResolution) { message.textContent = "Erreur de connexion lors du règlement du pari."; } document.getElementById("solde") .textContent = solde.toLocaleString("fr-FR") + " pts"; resultat.style.display = "block"; }});
function afficherPopupGain(gain){ const popup=document.createElement("div"); popup.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:9999;"; popup.innerHTML=`<div style="background:#111b2b;border:1px solid #25344c;border-radius:15px;padding:30px;text-align:center;max-width:320px;font-family:inherit;color:#fff;"><div style="font-size:42px;">🎉</div><h3 style="margin:12px 0;">Vous avez gagné ${gain.toLocaleString("fr-FR")} points !</h3><p style="color:#8996aa;font-size:13px;">Ajoutés automatiquement à votre solde.</p><button id="fermerPopupGain" style="margin-top:15px;padding:10px 25px;border:none;border-radius:8px;background:#20ff78;color:#000;font-weight:bold;cursor:pointer;">OK</button></div>`; document.body.appendChild(popup); document.getElementById("fermerPopupGain").addEventListener("click",()=>popup.remove()); }</script></body></html>
