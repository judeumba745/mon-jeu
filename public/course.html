<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Course automobile - Paris Game Center</title><style>* { box-sizing: border-box;}body { margin: 0; font-family: Arial, sans-serif; background: radial-gradient( circle at top, #1b2838, #05080c 70% ); color: white; min-height: 100vh;}.header { padding: 18px 25px; display: flex; justify-content: space-between; align-items: center; background: #070b11; border-bottom: 1px solid #293646;}.logo { display: flex; gap: 10px; align-items: center;}.logo-icon { font-size: 35px;}.logo h1 { margin: 0; color: #20ff78; font-size: 20px;}.logo p { margin: 2px 0; font-size: 11px; color: #8793a3;}.solde { color: #20ff78; font-weight: bold;}.container { width: 95%; max-width: 1100px; margin: 25px auto;}.top { text-align: center;}.top h2 { margin-bottom: 5px;}.top p { color: #98a5b5;}.info { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin: 20px 0;}.info-box { background: #121c28; border: 1px solid #29394b; padding: 12px 20px; border-radius: 12px;}.info-box strong { color: #20ff78;}.compteur { text-align: center; font-size: 38px; font-weight: bold; color: #20ff78; margin: 20px; min-height: 45px;}/* ========================= ROUTE========================= */.route { position: relative; background: #20252b; border-radius: 18px; overflow: hidden; border: 1px solid #35404b; box-shadow: 0 10px 40px rgba(0,0,0,.4);}.piste { height: 120px; position: relative; overflow: hidden; background: repeating-linear-gradient( 90deg, #30353b 0, #30353b 70px, #373c42 70px, #373c42 140px ); border-bottom: 3px solid #181b1e;}.piste:last-child { border-bottom: none;}/* ========================= LIGNES DE VITESSE========================= */.piste::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient( 90deg, transparent 0, transparent 75px, rgba(255,255,255,.12) 76px, rgba(255,255,255,.12) 80px, transparent 81px, transparent 150px ); background-position: 0 0; animation: routeDefile .30s linear infinite; animation-play-state: paused; pointer-events: none; z-index: 2;}@keyframes routeDefile { from { background-position: 0 0; } to { background-position: -150px 0; }}/* Démarre uniquement à GO.*/.route.course-active .piste::after { animation-play-state: running;}/* Arrivée : STOP.*/.route.course-finished .piste::after { animation-play-state: paused;}/* ========================= LIGNE DE PISTE========================= */.ligne-route { position: absolute; top: 62%; left: 0; right: 0; border-top: 3px dashed #d8d8d8; opacity: .65; z-index: 3;}/* ========================= NOM========================= */.nom-voiture { position: absolute; top: 8px; left: 12px; font-weight: bold; z-index: 7; text-shadow: 0 2px 4px #000;}/* ========================= VOITURE========================= */.voiture { position: absolute; left: 10px; bottom: 18px; /* Toutes les voitures ont exactement le même visuel. */ font-size: 46px; z-index: 8; /* REGARDE VERS LA DROITE. */ transform: scaleX(-1); will-change: left;}/* Roues / mouvement uniquement pendant la course.*/.route.course-active .voiture { animation: voitureSuspension .13s ease-in-out infinite alternate;}@keyframes voitureSuspension { from { margin-top: 0; } to { margin-top: -2px; }}/* Après la course : tout s'arrête.*/.route.course-finished .voiture { animation: none !important;}/* ========================= JOUEUR========================= */.voiture.joueur { filter: drop-shadow( 0 0 15px #20ff78 );}/* ========================= ARRIVÉE========================= */.arrivee { position: absolute; right: 35px; top: 0; height: 100%; width: 14px; background: repeating-linear-gradient( 45deg, white 0, white 10px, black 10px, black 20px ); z-index: 6;}/* ========================= RESULTAT========================= */.resultat { display: none; text-align: center; margin-top: 25px; padding: 25px; background: #101a25; border: 1px solid #20ff78; border-radius: 18px;}.classement { margin-top: 20px;}.place { background: #17222e; border: 1px solid #2c3b4b; border-radius: 10px; padding: 12px; margin: 8px auto; max-width: 450px; font-weight: bold;}.place.premier { border-color: #20ff78; box-shadow: 0 0 15px rgba(32,255,120,.2);}.message { color: #b4bfcc;}.btn { margin-top: 15px; border: none; background: #20ff78; color: #06100a; padding: 14px 25px; border-radius: 10px; font-weight: bold; cursor: pointer;}@media(max-width:600px) { .piste { height: 100px; } .voiture { font-size: 38px; bottom: 15px; } .nom-voiture { font-size: 13px; }}</style><script>(function () { const navigation = performance.getEntriesByType('navigation')[0]; // Actualisation
if (navigation && navigation.type === 'reload') { window.location.replace('/Paris.html'); return; } // Navigation directe vers la page
if (!document.referrer || !document.referrer.includes('Paris.html')) { window.location.replace('/Paris.html'); }})();</script> </head><body><header class="header"> <div class="logo"> <div class="logo-icon"> 🏎️ </div> <div> <h1>PARIS</h1> <p> GAME CENTER </p> </div> </div> <div class="solde"> 💰 <span id="solde"> -- </span> </div></header><div class="container"> <div class="top"> <h2> 🏎️ Course automobile </h2> <p> La course démarre après le compte à rebours. </p> </div> <div class="info"> <div class="info-box"> Votre voiture : <strong id="maVoiture"> --- </strong> </div> <div class="info-box"> Pari : <strong id="mise"> --- </strong> </div> </div> <div class="compteur" id="compteur" > 3 </div> <div class="route" id="route" > <!-- VOITURE 1 --> <div class="piste"> <div class="nom-voiture"> 🏎️ Voiture 1 </div> <div class="ligne-route"></div> <div class="voiture" id="voiture1" > 🏎️ </div> <div class="arrivee"></div> </div> <!-- VOITURE 2 --> <div class="piste"> <div class="nom-voiture"> 🏎️ Voiture 2 </div> <div class="ligne-route"></div> <div class="voiture" id="voiture2" > 🏎️ </div> <div class="arrivee"></div> </div> <!-- VOITURE 3 --> <div class="piste"> <div class="nom-voiture"> 🏎️ Voiture 3 </div> <div class="ligne-route"></div> <div class="voiture" id="voiture3" > 🏎️ </div> <div class="arrivee"></div> </div> <!-- VOITURE 4 --> <div class="piste"> <div class="nom-voiture"> 🏎️ Voiture 4 </div> <div class="ligne-route"></div> <div class="voiture" id="voiture4" > 🏎️ </div> <div class="arrivee"></div> </div> </div> <div class="resultat" id="resultat" > <h2> 🏆 Classement final </h2> <p class="message" id="messageResultat" ></p> <div class="classement" id="classement" ></div> <button class="btn" onclick="window.location.href='index.html'" > 🎮 Retour aux jeux </button> </div></div><script>document.addEventListener( "DOMContentLoaded", async () => { const params = new URLSearchParams( window.location.search ); const choix = params.get("choix") || "voiture1"; const mise = Math.floor(Number( params.get("mise") )) || 0; const token = localStorage.getItem("gameonline_token"); /* ========================= INFORMATIONS ========================= */ document.getElementById( "maVoiture" ).textContent = choix.replace( "voiture", "Voiture " ); document.getElementById( "mise" ).textContent = mise.toLocaleString( "fr-FR" ) + " pts"; /* ========================= SOLDE (SERVEUR - la mise est réellement débitée ici) ========================= */ let solde = 0; let betId = null; if (!token || mise <= 0) { alert("Session invalide ou mise incorrecte."); window.location.href = "/Paris.html"; return; } try { const miseRes = await fetch("/api/paris/mise", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token, jeu: "voiture", mise }) }); const miseData = await miseRes.json(); if (!miseData.success) { alert("❌ " + (miseData.error || "Mise refusée.")); window.location.href = "/Paris.html"; return; } betId = miseData.betId; solde = miseData.wallet.points; } catch (erreurMise) { alert("❌ Erreur de connexion au serveur."); window.location.href = "/Paris.html"; return; } document.getElementById( "solde" ).textContent = solde.toLocaleString( "fr-FR" ) + " pts"; /* ========================= VOITURES ========================= */ const voitures = [ { id: "voiture1", element: document.getElementById( "voiture1" ), position: 0, vitesse: 0 }, { id: "voiture2", element: document.getElementById( "voiture2" ), position: 0, vitesse: 0 }, { id: "voiture3", element: document.getElementById( "voiture3" ), position: 0, vitesse: 0 }, { id: "voiture4", element: document.getElementById( "voiture4" ), position: 0, vitesse: 0 } ]; const joueur = voitures.find( voiture => voiture.id === choix ); if(joueur) { joueur.element .classList .add( "joueur" ); } /* ========================= COMPTE À REBOURS ========================= */ let compteur = 3; const compteurElement = document.getElementById( "compteur" ); const countdown = setInterval( () => { compteur--; if( compteur > 0 ) { compteurElement .textContent = compteur; } else { compteurElement .textContent = "GO!"; clearInterval( countdown ); /* LES LIGNES DE VITESSE COMMENCENT ICI. */ document .getElementById( "route" ) .classList .add( "course-active" ); setTimeout( commencerCourse, 250 ); } }, 1000 ); /* ========================= COURSE ========================= */ function commencerCourse() { const route = document.getElementById( "route" ); const largeur = route.clientWidth; /* Distance exacte jusqu'à la ligne. */ const distance = largeur - 105; /* Vitesses de départ. */ voitures.forEach( voiture => { voiture.vitesse = 4.5 + Math.random() * 2.5; } ); let classement = []; let courseActive = true; const interval = setInterval( () => { if( !courseActive ) { return; } voitures.forEach( voiture => { /* Une voiture arrivée ne bouge plus. */ if( classement .includes( voiture.id ) ) { return; } /* Variation naturelle. */ voiture.vitesse += ( Math.random() - 0.5 ) * 0.18; if( voiture.vitesse < 4 ) { voiture.vitesse = 4; } if( voiture.vitesse > 8.5 ) { voiture.vitesse = 8.5; } /* IMPORTANT : position augmente. GAUCHE → DROITE */ voiture.position += voiture.vitesse; /* Arrivée. */ if( voiture.position >= distance ) { voiture.position = distance; /* Enregistrer la position dans le classement. */ classement.push( voiture.id ); } voiture.element .style.left = voiture.position + "px"; } ); /* Les 4 voitures sont arrivées. */ if( classement.length === 4 ) { courseActive = false; clearInterval( interval ); /* STOP TOTAL : - lignes - suspension - déplacement */ route .classList .remove( "course-active" ); route .classList .add( "course-finished" ); afficherResultat( classement ); } }, 60 ); } /* ========================= RESULTAT ========================= */ async function afficherResultat( classement ) { const resultat = document.getElementById( "resultat" ); const classementElement = document.getElementById( "classement" ); const message = document.getElementById( "messageResultat" ); classementElement.innerHTML = ""; const symboles = [ "🥇", "🥈", "🥉", "4️⃣" ]; classement.forEach( (id, index) => { const div = document.createElement( "div" ); div.className = "place"; if( index === 0 ) { div.classList .add( "premier" ); } const nom = id.replace( "voiture", "Voiture " ); div.textContent = symboles[index] + " " + ( index + 1 ) + " — " + nom; classementElement .appendChild( div ); } ); /* Le premier est toujours classement[0]. */ const premier = classement[0]; const gagne = (premier === choix); try { const resReq = await fetch("/api/paris/resoudre", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token, betId, gagne, multiplicateur: 2 }) }); const resData = await resReq.json(); if (resData.success) { solde = resData.wallet.points; if (gagne) { message.textContent = "🎉 Votre voiture est arrivée 1ère ! Gain : " + resData.gain + " pts."; afficherPopupGain(resData.gain); } else { const position = classement.indexOf( choix ) + 1; message.textContent = "Votre voiture est arrivée " + position + "e. Le gagnant est " + premier.replace( "voiture", "Voiture " ) + "."; } } else { message.textContent = "Erreur lors du règlement : " + (resData.error || ""); } } catch (erreurResolution) { message.textContent = "Erreur de connexion lors du règlement du pari."; } document.getElementById( "solde" ).textContent = solde.toLocaleString( "fr-FR" ) + " pts"; resultat.style.display = "block"; } });
function afficherPopupGain(gain){ const popup=document.createElement("div"); popup.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:9999;"; popup.innerHTML=`<div style="background:#111b2b;border:1px solid #25344c;border-radius:15px;padding:30px;text-align:center;max-width:320px;font-family:inherit;color:#fff;"><div style="font-size:42px;">🎉</div><h3 style="margin:12px 0;">Vous avez gagné ${gain.toLocaleString("fr-FR")} points !</h3><p style="color:#8996aa;font-size:13px;">Ajoutés automatiquement à votre solde.</p><button id="fermerPopupGain" style="margin-top:15px;padding:10px 25px;border:none;border-radius:8px;background:#20ff78;color:#000;font-weight:bold;cursor:pointer;">OK</button></div>`; document.body.appendChild(popup); document.getElementById("fermerPopupGain").addEventListener("click",()=>popup.remove()); }</script></body></html>
