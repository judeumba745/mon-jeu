<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>PARIS - Échecs</title><style>*{box-sizing:border-box}body{ margin:0; min-height:100vh; background:#07100b; color:white; font-family:Arial; display:flex; justify-content:center; align-items:center;}.container{ width:95%; max-width:650px; text-align:center;}h1{color:#20ff78}.info{ background:#101722; padding:14px; border-radius:12px; margin-bottom:15px;}#plateau{ width:min(95vw,560px); height:min(95vw,560px); margin:auto; display:grid; grid-template-columns:repeat(8,1fr); border:5px solid #20ff78;}.case{ aspect-ratio:1; display:flex; justify-content:center; align-items:center; font-size:clamp(25px,7vw,55px);}.blanc{background:#e8d6ad}.noir{background:#704b35}#status{ margin:20px; color:#20ff78;}#gameOver{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.9); justify-content:center; align-items:center; flex-direction:column;}#resultat{ color:#20ff78; font-size:30px;}button{ padding:12px 25px; border:0; border-radius:10px; background:#20ff78; font-weight:bold;}</style></head><body><div class="container"><h1>♔♚ PARIS — ÉCHECS</h1><div class="info"> <div id="joueur"></div> <div id="mise"></div> <div id="solde"></div></div><div id="plateau"></div><div id="status">La partie commence...</div></div><div id="gameOver"> <h2 id="resultat"></h2> <button onclick="location.href='index.html'">Retour</button></div><script>(async function(){ const params=new URLSearchParams(location.search);const choix=params.get("choix") || "blanc";const mise=Math.floor(Number(params.get("mise") || 0));const token=localStorage.getItem("gameonline_token"); let betId=null; if(!token || mise<=0){ alert("Session invalide ou mise incorrecte."); window.location.href="/Paris.html"; return; } try{ const miseRes=await fetch("/api/paris/mise",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,jeu:"echecs",mise})}); const miseData=await miseRes.json(); if(!miseData.success){ alert("❌ "+(miseData.error||"Mise refusée.")); window.location.href="/Paris.html"; return; } betId=miseData.betId; document.getElementById("solde").textContent="Solde : "+miseData.wallet.points.toLocaleString("fr-FR")+" pts"; }catch(erreurMise){ alert("❌ Erreur de connexion au serveur."); window.location.href="/Paris.html"; return; } document.getElementById("joueur").textContent= "Camp choisi : "+ (choix==="noir"?"♚ Noirs":"♔ Blancs");document.getElementById("mise").textContent= "Mise : "+mise+" pts";const pieces={ r:"♜", n:"♞", b:"♝", q:"♛", k:"♚", p:"♟", R:"♖", N:"♘", B:"♗", Q:"♕", K:"♔", P:"♙"};let board=["r","n","b","q","k","b","n","r","p","p","p","p","p","p","p","p","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","P","P","P","P","P","P","P","P","R","N","B","Q","K","B","N","R"];let tour="blanc";let termine=false;const plateau=document.getElementById("plateau");const status=document.getElementById("status");function couleurPiece(p){ if(!p)return null; return p===p.toUpperCase() ?"blanc" :"noir";}function afficher(){ plateau.innerHTML=""; for(let i=0;i<64;i++){ const cell=document.createElement("div"); cell.className= "case "+ ((Math.floor(i/8)+i%8)%2===0 ?"blanc" :"noir"); if(board[i]){ cell.textContent=pieces[board[i]]; } plateau.appendChild(cell); }}function ligneLibreChemin(from,to,dx,dy){ let x=from%8; let y=Math.floor(from/8); const tx=to%8; const ty=Math.floor(to/8); x+=dx; y+=dy; while(x!==tx || y!==ty){ const i=y*8+x; if(board[i])return false; x+=dx; y+=dy; } return true;}function mouvementValide(from,to){ if(from===to)return false; const p=board[from]; if(!p)return false; const cible=board[to]; if( cible && couleurPiece(cible)===couleurPiece(p) ){ return false; } const fx=from%8; const fy=Math.floor(from/8); const tx=to%8; const ty=Math.floor(to/8); const dx=tx-fx; const dy=ty-fy; const type=p.toLowerCase(); if(type==="p"){ const dir=p==="P"?-1:1; if(dx===0 && dy===dir && !cible) return true; if( Math.abs(dx)===1 && dy===dir && cible && couleurPiece(cible)!==couleurPiece(p) ) return true; return false; } if(type==="n"){ return( Math.abs(dx)===2 && Math.abs(dy)===1 ) || ( Math.abs(dx)===1 && Math.abs(dy)===2 ); } if(type==="k"){ return( Math.abs(dx)<=1 && Math.abs(dy)<=1 ); } if(type==="r"){ if(dx!==0 && dy!==0)return false; const sx=dx===0?0:dx>0?1:-1; const sy=dy===0?0:dy>0?1:-1; return ligneLibreChemin(from,to,sx,sy); } if(type==="b"){ if(Math.abs(dx)!==Math.abs(dy)) return false; const sx=dx>0?1:-1; const sy=dy>0?1:-1; return ligneLibreChemin(from,to,sx,sy); } if(type==="q"){ if( dx!==0 && dy!==0 && Math.abs(dx)!==Math.abs(dy) ){ return false; } const sx=dx===0?0:dx>0?1:-1; const sy=dy===0?0:dy>0?1:-1; return ligneLibreChemin(from,to,sx,sy); } return false;}function coupsPossibles(couleur){ const coups=[]; for(let from=0;from<64;from++){ if( !board[from] || couleurPiece(board[from])!==couleur )continue; for(let to=0;to<64;to++){ if(mouvementValide(from,to)){ coups.push({from,to}); } } } return coups;}function jouer(coup){ board[coup.to]=board[coup.from]; board[coup.from]=""; afficher(); const roiAdverse= tour==="blanc"?"k":"K"; if(!board.includes(roiAdverse)){ terminer( tour===choix, tour===choix ?"🏆 Vous avez gagné !" :"💀 Votre adversaire gagne !" ); return true; } return false;}function tourAutomatique(){ if(termine)return; const coups=coupsPossibles(tour); if(coups.length===0){ terminer( tour===choix, tour===choix ?"🏆 Vous avez gagné !" :"💀 Votre adversaire gagne !" ); return; } // L'IA privilégie les captures
const captures=coups.filter(c=>board[c.to]); const liste= captures.length ?captures :coups; const coup= liste[Math.floor(Math.random()*liste.length)]; if(jouer(coup))return; tour=tour==="blanc"?"noir":"blanc"; status.textContent= "Tour automatique : "+ (tour==="blanc"?"♔ Blancs":"♚ Noirs"); setTimeout(tourAutomatique,900);}async function terminer(gagne, message){ termine=true; try{ const resReq=await fetch("/api/paris/resoudre",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,betId,gagne,multiplicateur:2})}); const resData=await resReq.json(); if(resData.success){ document.getElementById("solde").textContent="Solde : "+resData.wallet.points.toLocaleString("fr-FR")+" pts"; if(gagne){ message+=" Gain : "+resData.gain+" pts."; afficherPopupGain(resData.gain); } } }catch(erreurResolution){ console.error(erreurResolution); } document.getElementById("resultat").textContent=message; document.getElementById("gameOver").style.display="flex"; status.textContent="Partie terminée";}
function afficherPopupGain(gain){ const popup=document.createElement("div"); popup.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:9999;"; popup.innerHTML=`<div style="background:#111b2b;border:1px solid #25344c;border-radius:15px;padding:30px;text-align:center;max-width:320px;font-family:inherit;color:#fff;"><div style="font-size:42px;">🎉</div><h3 style="margin:12px 0;">Vous avez gagné ${gain.toLocaleString("fr-FR")} points !</h3><p style="color:#8996aa;font-size:13px;">Ajoutés automatiquement à votre solde.</p><button id="fermerPopupGain" style="margin-top:15px;padding:10px 25px;border:none;border-radius:8px;background:#20ff78;color:#000;font-weight:bold;cursor:pointer;">OK</button></div>`; document.body.appendChild(popup); document.getElementById("fermerPopupGain").addEventListener("click",()=>popup.remove()); }afficher();setTimeout(tourAutomatique,1000);})();</script></body></html>
