<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dame — Tournoi</title><style>body{background:#050505;color:#fff;font-family:Arial,sans-serif;margin:0;padding:16px;text-align:center}#top{max-width:900px;margin:auto}.badge{display:inline-block;padding:8px 14px;border-radius:10px;background:#92400e;color:#facc15;font-weight:800}.meta{margin:12px auto;color:#aaa;line-height:1.5}.board{margin:20px auto;display:grid;gap:4px;justify-content:center}.cell{display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}.status{min-height:28px;font-weight:700;margin:12px}.over{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;flex-direction:column;font-size:28px;z-index:10}.btn{padding:12px 18px;border:0;border-radius:10px;cursor:pointer;font-weight:800}</style></head><body><div id="top"><div class="badge">🏆 Tournoi — Dame</div><div id="meta" class="meta">Connexion au serveur...</div><div id="status" class="status">Vérification de l’accès...</div><div id="board" class="board" style="grid-template-columns:repeat(10,44px)"></div></div><div id="over" class="over"></div><script src="/socket.io/socket.io.js"></script><script>const q=new URLSearchParams(location.search),matchId=q.get('matchId'),token=q.get('token')||localStorage.getItem('gameonline_token');let socket,match,state,side,locked=true;
const $=id=>document.getElementById(id);function fail(m){$('status').textContent=m;locked=true;}function fmt(d){return new Date(d).toLocaleString('fr-FR',{timeZone:'Africa/Kinshasa'});}
async function boot(){if(!matchId||!token)return fail('Paramètres du match manquants.');try{const r=await fetch('/api/tournament/match/access',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({matchId,token})});const d=await r.json();if(!r.ok||!d.success)return fail(d.error||'Accès refusé.');match=d;state=d.state;side=d.p1.id==token?1:2;$('meta').textContent=`${d.p1.firstname} ${d.p1.name} VS ${d.p2.firstname} ${d.p2.name} • Match à ${fmt(d.datetime)}`;socket=io();socket.emit('joinTournamentMatch',{matchId,token});socket.on('tournamentError',fail);socket.on('tournamentState',d=>{match=d;state=d.state;render();});socket.on('matchStarted',d=>{state=d.state;match=d;locked=false;render();$('status').textContent='Match lancé !';});socket.on('state',d=>{state=d.state;locked=false;render();});socket.on('gameOver',d=>{locked=true;$('over').style.display='flex';$('over').innerHTML=d.winner==='draw'?'🤝 Match nul<br><small>Rematch automatique...</small>':`🏆 ${d.winnerPlayerId==token?'Tu as gagné !':'Match terminé'}`;});}catch(e){fail('Serveur injoignable.');}}
function send(move){if(locked)return;socket.emit('tournamentMove',{matchId,token,move});}
boot();
function render(){const b=$('board');b.innerHTML='';state.board.forEach((v,i)=>{const x=document.createElement('div');x.className='cell';x.style.width='44px';x.style.height='44px';x.style.background=(Math.floor(i/10)%2!==i%2)?'#171717':'#d4af37';x.textContent=v===1?'🔴':v===2?'🔵':v===3?'👑':v===4?'👑':'';x.onclick=()=>clickD(i);b.appendChild(x);});$('status').textContent=state.currentPlayer=== (side===1?'red':'blue')?'À toi':'Tour de l’adversaire';}
let selected=null;function clickD(i){if(locked)return;if(selected===null){selected=i;render();return;}if(selected===i){selected=null;render();return;}send({from:selected,to:i});selected=null;}
</script></body></html>
